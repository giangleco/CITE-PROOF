[project]
name = "citeproof"
version = "0.1.0"
description = "CiteProof citation verification platform"
authors = [
    { name = "giangleco", email = "gianglehoang14205@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.13,<3",
    "argon2-cffi>=25.1.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "idna>=3.20",
    "jinja2>=3.1.6",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2",
    "pydantic-settings>=2.16.3",
    "pypdfium2>=5.15.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.4",
    "rapidfuzz>=3.14.6",
    "sqlalchemy[asyncio]>=2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", ".superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]  # chuỗi CHECK sinh tự động

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
packages = ["citeproof"]

[[tool.mypy.overrides]]
# pypdfium2 không kèm py.typed; mọi lời gọi gói gọn trong `citeproof.parsing.pdf`.
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "db: needs PostgreSQL",
    "live: calls the real Anthropic API (needs CITEPROOF_LIVE_LLM=1 and a key)",
    "grobid: calls a live GROBID service (needs CITEPROOF_LIVE_GROBID=1)",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.6",
    "types-defusedxml>=0.7.0.20260504",
    "types-pyyaml>=6.0.12.20261122",
]
