# Pilot: một máy chủ, HTTPS tự động qua Caddy (docs/14 §4.10). Chạy với
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# POSTGRES_PASSWORD và CITEPROOF_DOMAIN lấy từ --env-file; app/worker/migrate đọc .env.production.
x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  env_file: .env.production
  networks:
    - citeproof

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CITEPROOF_DOMAIN: ${CITEPROOF_DOMAIN:?đặt CITEPROOF_DOMAIN trong .env.production}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      citeproof:
        ipv4_address: 172.30.0.10
    depends_on:
      app:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: citeproof
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong .env.production}
      POSTGRES_DB: citeproof
    volumes:
      - citeproof_db:/var/lib/postgresql/data
      # Tạo thêm citeproof_eval (đánh giá chất lượng) ở lần khởi tạo đầu tiên
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citeproof"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - citeproof

  grobid:
    image: lfoppiano/grobid:0.8.1
    restart: unless-stopped
    mem_limit: 4g
    environment:
      JAVA_TOOL_OPTIONS: "-XX:-UseContainerSupport"
    networks:
      - citeproof

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    restart: unless-stopped
    command: ["python", "-m", "citeproof.api"]
    environment:
      CITEPROOF_ENV: pilot
      CITEPROOF_TRUSTED_PROXIES: 172.30.0.10
    volumes:
      - citeproof_storage:/app/var/storage
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    restart: unless-stopped
    command: ["python", "-m", "citeproof.pipeline"]
    environment:
      CITEPROOF_ENV: pilot
      CITEPROOF_GROBID_URL: http://grobid:8070
    volumes:
      - citeproof_storage:/app/var/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      grobid:
        condition: service_started

  backup:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c"]
    command: ["while true; do /scripts/backup.sh || echo \"BACKUP FAILED (exit $$?)\" >&2; sleep 86400; done"]
    environment:
      PGHOST: db
      PGUSER: citeproof
      PGPASSWORD: ${POSTGRES_PASSWORD:?đặt POSTGRES_PASSWORD trong .env.production}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - citeproof_storage:/storage:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - citeproof

networks:
  citeproof:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  citeproof_db:
  citeproof_storage:
  caddy_data:
  caddy_config:
