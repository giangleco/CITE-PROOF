services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: citeproof
      POSTGRES_PASSWORD: citeproof
      POSTGRES_DB: citeproof
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - citeproof_db:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citeproof"]
      interval: 5s
      timeout: 5s
      retries: 10

  grobid:
    image: lfoppiano/grobid:0.8.1
    environment:
      JAVA_TOOL_OPTIONS: "-XX:-UseContainerSupport"
    ports:
      - "127.0.0.1:8070:8070"

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
    environment: &app-env
      CITEPROOF_DATABASE_URL: postgresql+psycopg://citeproof:citeproof@db:5432/citeproof
      CITEPROOF_STORAGE_DIR: /app/var/storage
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "citeproof.api"]
    env_file:
      - path: .env
        required: false
    environment: *app-env
    volumes:
      - citeproof_storage:/app/var/storage
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "citeproof.pipeline"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      CITEPROOF_GROBID_URL: http://grobid:8070
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - citeproof_storage:/app/var/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      grobid:
        condition: service_started

volumes:
  citeproof_db:
  citeproof_storage:
