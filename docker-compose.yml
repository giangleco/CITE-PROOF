services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: citeproof
      POSTGRES_PASSWORD: citeproof
      POSTGRES_DB: citeproof
    ports:
      - "5432:5432"
    volumes:
      - citeproof_db:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citeproof"]
      interval: 5s
      timeout: 5s
      retries: 10

  grobid:
    image: lfoppiano/grobid:0.8.1
    ports:
      - "8070:8070"

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: &app-env
      CITEPROOF_DATABASE_URL: postgresql+psycopg://citeproof:citeproof@db:5432/citeproof
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command:
      - uvicorn
      - --factory
      - citeproof.api.app:create_app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "citeproof.pipeline"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  citeproof_db:
