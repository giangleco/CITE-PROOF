<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="csrf-token" content="{{ csrf_token }}">
<title>{% block title %}CiteProof{% endblock %}</title>
<link rel="stylesheet" href="/static/css/fonts.css">
<link rel="stylesheet" href="/static/css/app.css">
<script src="/static/vendor/htmx.min.js" defer></script>
<script src="/static/js/app.js" defer></script>
</head>
<body>
{% include "partials/icons.html" %}
<header class="topbar">
  <a class="brand" href="{{ '/documents' if current else '/login' }}" aria-label="CiteProof, về trang chính">Cite<span class="mark">[</span>Proof<span class="mark">]</span></a>
  {% if current and not hide_nav %}
  <nav class="nav" aria-label="Điều hướng chính">
    <a href="/documents"{% if nav == 'documents' %} aria-current="page"{% endif %}>Tài liệu của tôi</a>
    <a href="/documents/new"{% if nav == 'new' %} aria-current="page"{% endif %}>Kiểm tra bài mới</a>
  </nav>
  <details class="account">
    <summary aria-label="Tài khoản của {{ current.user.display_name }}"><span class="avatar">{{ current.user.display_name[:1] | upper }}</span></summary>
    <div class="menu">
      <p class="menu-name">{{ current.user.display_name }}</p>
      <p class="menu-email">{{ current.user.email }}</p>
      <a href="/account">Tài khoản</a>
      <form method="post" action="/logout">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit">Đăng xuất</button>
      </form>
    </div>
  </details>
  {% endif %}
</header>
<main id="main">
{% block content %}{% endblock %}
</main>
<div class="toast" id="toast" role="status" aria-live="polite"{% if toast %} data-toast="{{ toast }}"{% endif %}></div>
</body>
</html>
