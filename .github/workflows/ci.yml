name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: citeproof
          POSTGRES_PASSWORD: citeproof
          POSTGRES_DB: citeproof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citeproof"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.3"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: make check
      - run: uv run pytest
        env:
          CITEPROOF_TEST_DATABASE_URL: postgresql+psycopg://citeproof:citeproof@localhost:5432/citeproof_test
          CITEPROOF_REQUIRE_DB: "1"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
